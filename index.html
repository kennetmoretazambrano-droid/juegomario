<script>
const W=960,H=544,T=32,G=1900,GR=15,cv=document.getElementById('c'),c=cv.getContext('2d'),K={},R=Math.random,sin=Math.sin,cos=Math.cos,abs=Math.abs,mn=Math.min,mx=Math.max;

function tone(f,d,ty='square',sl=0,v=.12,t0=0){if(!AC)return;const n=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(mx(40,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(MG);o.start(n);o.stop(n+d)}

const S={jump:()=>tone(330,.2,'square',420),coin:()=>nt([880,1320],.12,.07),pow:()=>nt([392,494,587,784],.1,.07),hit:()=>tone(180,.2,'sawtooth',-120),stomp:()=>tone(240,.12,'square',-160),fire:()=>tone(600,.15,'sawtooth',-400,.08),die:()=>nt([392,330,262,196,131],.2,.14),win:()=>nt([523,659,784,1047,1319],.2,.12),boom:()=>tone(90,.5,'sawtooth',-60,.25)};
const MU=[{b:150,r:60,s:[0,2,4,7,9],q:7},{b:116,r:57,s:[0,3,5,7,10],q:3},{b:168,r:52,s:[0,1,4,5,7,8],q:11},{b:188,r:50,s:[0,1,3,5,6,8],q:5}];
function music(i){clearInterval(mus);if(i<0||!AC)return;const m=MU[i];let sd=m.q*977,s=0;const rd=()=>(sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff,
 pat=[...Array(16)].map(()=>rd()<.25?-1:m.s[(rd()*m.s.length)|0]+(rd()<.3?12:0)),bs=[0,0,7,5],f=n=>440*Math.pow(2,(m.r+n-69)/12);

const LV=[
{nm:'COLINAS VERDES',len:105,sky:['#4fc3ff','#d8f4ff'],mt:['#a6dcb9','#72c78f','#3fa56b'],gr:'#52c24a',dirt:'#8a5a34',liq:'#16233f',mu:0,
 gap:[[20,23],[52,55],[80,84]],pl:[[9,11,4,'b'],[30,11,3,'b'],[36,9,3,'b'],[42,11,4,'b'],[60,11,5,'b'],[66,9,3,'b'],[88,11,4,'b']],
 q:[[13,11,'m'],[33,11,'c'],[39,9,'f'],[65,11,'c'],[92,11,'s']],pp:[[28,2],[48,3],[70,2],[96,3]],mvp:[],

{nm:'REINO HELADO',len:105,sky:['#8fb8ff','#f2f9ff'],mt:['#d6e8ff','#aecbf5','#80a8e0'],gr:'#eaf7ff',dirt:'#6c8fb8',liq:'#123a66',mu:1,ice:1,
 gap:[[18,24],[44,50],[70,76]],pl:[[8,11,4,'i'],[26,11,3,'i'],[32,9,3,'i'],[52,11,5,'i'],[58,9,3,'i'],[78,11,4,'i'],[84,9,3,'i'],[92,11,4,'i']],
 q:[[12,11,'f'],[29,11,'c'],[57,11,'m'],[82,11,'s']],pp:[[38,2],[62,3],[86,2]],mvp:[[19,14,3,1,0],[45,14,3,1,0],[71,14,3,1,0]],
 en:[['w',14],['c',28],['s',35],['f',40,9],['w',55],['s',60],['c',66],['f',80,8],['w',88],['s',97]],co:[[4,13,4],[8,9,4],[19,11,4],[45,11,4],[52,9,5],[71,11,4],[84,7,3]]},
{nm:'VOLCÁN DE FUEGO',len:100,sky:['#2a0a12','#c2410c'],mt:['#5a1a26','#431220','#2c0b16'],gr:'#6b6b73',dirt:'#3b3340',liq:'#ff5a10',mu:2,boss:1,cl:'rgba(40,10,15,.55)',
 gap:[[16,22],[34,42],[50,56]],pl:[[8,11,4,'b'],[26,11,3,'b'],[60,11,4,'b'],[66,9,3,'b']],
 q:[[12,11,'f'],[29,11,'m'],[64,11,'c'],[69,9,'s']],pp:[],mvp:[[17,14,3,1,0],[34.5,14,3,1.2,0],[38.5,13,3,1.2,0],[51,14,3,0,1.2]],
 en:[['w',12],['c',26],['f',30,9],['s',45],['w',47],['c',59],['w',63],['f',67,8],['s',73]],co:[[4,13,4],[8,9,4],[17,11,3],[35,10,4],[51,10,3],[60,9,4]]}];
/* ===== ESTADO ===== */
let st='title',L=LV[0],li=0,cam=0,sc=0,coins=0,lives=3,tm=300,lost=0,stars=0,bl=[],en=[],it=[],sh=[],cn=[],ptc=[],B=null,P=null,t=0,fade=1,shake=0,intro=0,msel=0,sel=0,fy=0,tp=null;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,ox=(a,b)=>mn(a.x+a.w,b.x+b.w)-mx(a.x,b.x);
const burst=(x,y,n,col,sp,s)=>{for(let i=0;i<n;i++){const a=R()*6.28,v=sp*(.3+R()*.7),l=.4+R()*.5;ptc.push({x,y,vx:cos(a)*v,vy:sin(a)*v-sp*.3,l,m:l,col,s})}};
/* ===== FÍSICA: AABB con ejes separados ===== */
function mv(e,dt){const r={x:0,top:null,g:0,gb:null};e.x+=e.vx*dt;let h=bl.filter(b=>hit(e,b));
 if(h.length){if(e.vx>0)e.x=mn(...h.map(b=>b.x))-e.w;else if(e.vx<0)e.x=mx(...h.map(b=>b.x+b.w));r.x=1}
 e.y+=e.vy*dt;h=bl.filter(b=>hit(e,b));
 if(h.length){if(e.vy>0){const b=h.reduce((a,b)=>b.y<a.y?b:a);e.y=b.y-e.h;r.g=1;r.gb=b}else if(e.vy<0){e.y=mx(...h.map(b=>b.y+b.h));r.top=h.reduce((a,b)=>ox(e,b)>ox(e,a)?b:a)}e.vy=0}
 return r}
function build(i){li=i;L=LV[i];fy=4*T+4;tp=null;bl=[];en=[];it=[];sh=[];cn=[];ptc=[];B=null;
 const b=(x,y,w,h,t,ct)=>bl.push({x:x*T,y:y*T,w:w*T,h:h*T,t,c:ct,bump:0});let s=0;
 [...L.gap,[L.len,L.len]].forEach(([a,e])=>{if(a>s)b(s,GR,a-s,2,'g');s=e});
 L.pl.forEach(([x,y,w,t])=>{for(let k=0;k<w;k++)b(x+k,y,1,1,t)});L.q.forEach(([x,y,q])=>b(x,y,1,1,'q',q));L.pp.forEach(([x,h])=>b(x,GR-h,2,h,'p'));
 L.mvp.forEach(([x,y,w,ax,ay])=>bl.push({x:x*T,y:y*T,w:w*T,h:14,t:'m',bx:x*T,by:y*T,ax:ax*T,ay:ay*T,dx:0,dy:0,bump:0}));
 b(-1,0,1,GR,'h');if(L.boss){b(L.len-1,0,1,GR,'h');B={x:88*T,y:GR*T-96,w:80,h:96,vx:0,vy:0,hp:6,f:-1,cd:2,act:0,dead:0,inv:0,an:0,jt:3,g:0}}
 L.en.forEach(([t,x,y])=>{const f=t==='f';en.push({t,x:x*T,y:f?y*T:GR*T-28,w:30,h:28,vx:f?-70:t==='w'?-60:0,vy:0,dead:0,an:R()*6,cd:1+R()*1.5,x0:x*T,y0:(y||0)*T})});
 L.co.forEach(([x,y,n])=>{for(let k=0;k<n;k++)cn.push({x:(x+k)*T+8,y:y*T+6,w:16,h:20,g:0})})}
function spawn(){cam=0;P={x:2*T,y:GR*T-40,w:24,h:40,vx:0,vy:0,f:1,g:0,pw:P?P.pw:0,star:0,inv:0,cr:0,an:0,st:'idle',dead:0,win:0,coy:0,buf:0,fcd:0,gb:null,sq:0}}
function startLevel(i){lost=0;tm=300;build(i);spawn();st='play';fade=1;intro=2.4;music(L.mu)}
const go=s=>{st=s;msel=0;fade=1;if(s==='sel')sel=mn(sel,SV.un-1);if(s!=='play'&&s!=='pause')music(-1)};
/* ===== JUGADOR ===== */
function hurtP(){if(P.inv>0||P.star>0||P.dead||P.win||P.grab)return;if(P.pw){P.pw=0;P.inv=1.6;shake=.3;S.hit();burst(P.x+12,P.y+20,12,'#fff',200,3)}else kill()}
function kill(){if(P.dead)return;P.dead=.01;P.vy=-760;P.pw=0;S.die();music(-1)}
function die2(){lives--;lost++;if(lives<0)go('over');else{build(li);spawn();tm=300;music(L.mu)}}
/* ===== BANDERA FINAL: el héroe se agarra al mástil, se desliza, salta al otro lado y camina ===== */
function startGrab(){const p=P,bot=GR*T,hf=mx(0,mn(1,1-(p.y+p.h-4*T)/(bot-4*T)));
 if(p.cr){p.cr=0;p.h=40;p.y-=14}
 p.grab=1;p.gt=0;p.vx=0;p.vy=0;music(-1);S.pow();const b=Math.round(100+hf*hf*4900);sc+=b;tp={s:'+'+b,x:p.x,y:p.y-10,l:1.6}} // más alto = más puntos
function grabStep(dt){const p=P,px=(L.len-4)*T,bot=GR*T;p.gt+=dt;if(tp){tp.y-=40*dt;tp.l-=dt}
 if(p.grab===1){p.x=px-p.w+3;p.f=1;p.vy=260;p.y=mn(bot-p.h,p.y+260*dt);fy=mn(bot-40,fy+260*dt);p.g=0;p.st='fall';if(p.y>=bot-p.h){p.grab=2;p.gt=0;p.g=1;p.st='idle'}}
 else if(p.grab===2){p.g=1;if(p.gt>.5){p.grab=3;p.gt=0;p.x=px+8;p.f=1;p.vy=-260}}
 else{p.vy+=G*dt;p.vx=130;const q=mv(p,dt);p.g=q.g;p.x=mn(p.x,L.len*T-p.w);p.an+=dt*abs(p.vx)/18;p.st=p.g?'walk':'jump';if(p.gt>1.1)complete()}}
function complete(){if(P.win)return;P.win=1;P.grab=0;music(-1);S.win();sc+=(tm|0)*10;stars=1+(lost===0?1:0)+(tm>150?1:0);SV.st[li]=mx(SV.st[li]||0,stars);SV.un=mx(SV.un,mn(LV.length,li+2));SV.hi=mx(SV.hi,sc);save();setTimeout(()=>go(li<LV.length-1?'win':'end'),1800)}
function kb(b){en.forEach(e=>{if(!e.dead&&e.x+e.w>b.x&&e.x<b.x+b.w&&abs(e.y+e.h-b.y)<8){e.dead=.01;sc+=100}})}
function bump(b){if(b.t==='q'&&b.c){const q=b.c;b.c=0;b.bump=.15;if(q==='c'){coins++;sc+=200;S.coin();burst(b.x+16,b.y,8,'#ffd23f',160,3)}else{it.push({t:q==='m'&&P.pw?'f':q,x:b.x+3,y:b.y,w:26,h:26,vx:80,vy:0,ty:b.y-26,free:0});S.pow()}kb(b)}
 else if(b.t==='b'){if(P.pw){bl.splice(bl.indexOf(b),1);sc+=50;S.hit();burst(b.x+16,b.y+16,10,'#c4693a',220,5)}else{b.bump=.15;S.hit()}kb(b)}}
function upP(dt){const p=P;
 if(p.dead){p.vy+=G*dt;p.y+=p.vy*dt;p.dead+=dt;if(p.dead>1.8)die2();return}
 if(p.grab){grabStep(dt);return}
 const w=p.win,l=!w&&(K.ArrowLeft||K.KeyA),r=!w&&(K.ArrowRight||K.KeyD),j=!w&&(K.Space||K.ArrowUp||K.KeyW),rn=K.ShiftLeft||K.ShiftRight,dn=!w&&(K.ArrowDown||K.KeyS);
 if(p.gb&&p.gb.t==='m'){p.x+=p.gb.dx;p.y+=p.gb.dy}
 if(dn&&p.g&&!p.cr){p.cr=1;p.h=26;p.y+=14}else if(p.cr&&!dn){const q={x:p.x,y:p.y-14,w:p.w,h:40};if(!bl.some(b=>hit(q,b))){p.cr=0;p.h=40;p.y-=14}}
 const ice=L.ice&&p.g,M=(rn?340:240)*(p.star>0?1.15:1),ac=p.g?(ice?520:1900):1200;
 if(!p.cr&&l&&!r){p.vx-=ac*(p.vx>0?2:1)*dt;p.f=-1}else if(!p.cr&&r&&!l){p.vx+=ac*(p.vx<0?2:1)*dt;p.f=1}
 else{const fr=(p.cr?320:p.g?(ice?150:1800):260)*dt;p.vx=abs(p.vx)<=fr?0:p.vx-Math.sign(p.vx)*fr}
 p.vx=mx(-M-60,mn(M+60,p.vx));
 p.coy=p.g?.1:p.coy-dt;p.buf-=dt;
 if(w&&p.g&&!p.cr)p.vy=-520;
 if(p.buf>0&&p.coy>0&&!p.cr){p.vy=-780;p.g=0;p.coy=0;p.buf=0;S.jump();burst(p.x+12,p.y+p.h,6,'rgba(255,255,255,.7)',90,3)}
 p.vy=mn(950,p.vy+(p.vy<0&&!j?G*2.7:G)*dt);
 const was=p.g,q=mv(p,dt);p.g=q.g;p.gb=q.gb;if(q.top)bump(q.top);
 if(p.g&&!was){p.sq=1;burst(p.x+12,p.y+p.h,6,'rgba(255,255,255,.7)',110,3)}
 p.sq=mx(0,p.sq-dt*6);p.an+=dt*abs(p.vx)/18;p.inv=mx(0,p.inv-dt);p.fcd-=dt;if(p.star>0)p.star-=dt;
 if(p.g&&abs(p.vx)>180&&R()<dt*14)burst(p.x+12,p.y+p.h,1,'rgba(255,255,255,.6)',50,3);
 if(p.pw===2&&(K.KeyX||K.KeyZ)&&p.fcd<=0&&!p.cr&&!w){sh.push({x:p.x+(p.f>0?p.w:-8),y:p.y+14,w:10,h:10,vx:p.f*540,vy:-60,tm:'p',l:1.8});S.fire();p.fcd=.35}
 p.st=p.cr?(abs(p.vx)>60?'slide':'crouch'):!p.g?(p.vy<0?'jump':'fall'):abs(p.vx)>270?'run':abs(p.vx)>20?'walk':'idle';
 if(p.x<cam){p.x=cam;p.vx=mx(0,p.vx)}p.x=mn(p.x,L.len*T-p.w);

/* ===== ENEMIGOS: caminante, perseguidor, volador y lanzador ===== */
function upE(e,dt){e.an+=dt;if(e.dead){e.dead+=dt;return}if(abs(e.x-cam-W/2)>W*.8)return;const d=P.x-e.x;

 const w0=e.w;e.x+=8;e.w=14;const r=mv(e,dt);e.x-=8;e.w=w0;if(r.x&&e.t==='w')e.vx=-e.vx;if(e.y>H+80)e.dead=9}
/* ===== JEFE: Magmaron, 3 fases ===== */
function dmgB(){if(B.inv>0)return;B.hp--;B.inv=.9;S.hit();shake=.25;burst(B.x+40,B.y+40,14,'#ffb020',260,4);if(B.hp<=0){B.dead=.01;S.boom();sh=sh.filter(s=>s.tm==='p')}}
function upB(dt){const b=B;
 if(b.dead){b.dead+=dt;shake=.2;if(R()<.6)burst(b.x+R()*b.w,b.y+R()*b.h,3,R()<.5?'#ffb020':'#ff4020',300,5);if(b.dead>2.5&&!b.done){b.done=1;S.boom();complete()}return}
 b.an+=dt;b.inv=mx(0,b.inv-dt);if(!b.act){if(P.x>(L.len-26)*T){b.act=1;music(3)}else return}
 const ph=b.hp>4?0:b.hp>2?1:2;b.f=P.x>b.x?1:-1;b.vy+=G*dt;if(b.g)b.vx=b.f*(70+ph*50);
 b.cd-=dt;if(b.cd<=0){b.cd=[2.2,1.6,1.1][ph];for(let k=0;k<=ph;k++)sh.push({x:b.x+(b.f>0?b.w:-12),y:b.y+30+k*18,w:16,h:16,vx:b.f*(240+ph*40),vy:-80+k*40,tm:'e',g:1,l:4})}
 b.jt-=dt;if(b.jt<=0&&b.g){b.vy=-720;b.jt=[3.2,2.4,1.6][ph];b.vx=b.f*180}

/* ===== ACTUALIZACIÓN ===== */
function upd(dt){t+=dt;fade=mx(0,fade-dt*2.2);shake=mx(0,shake-dt);if(st!=='play')return;

 bl.forEach(b=>{if(b.bump>0)b.bump-=dt;if(b.t==='m'){const s=sin(t*1.1+b.bx),nx=b.bx+s*b.ax,ny=b.by+s*b.ay;b.dx=nx-b.x;b.dy=ny-b.y;b.x=nx;b.y=ny}});
 upP(dt);

  if(P.star>0){e.dead=.01;sc+=100;S.stomp()}else if(P.vy>0&&P.y+P.h-e.y<22){e.dead=.01;P.vy=(K.Space||K.ArrowUp||K.KeyW)?-660:-420;sc+=100;S.stomp();burst(e.x+15,e.y+14,8,'#fff',160,3)}else hurtP()});
 en=en.filter(e=>!(e.dead>.6));
 it.forEach(i=>{if(!i.free){i.y-=50*dt;if(i.y<=i.ty){i.y=i.ty;i.free=1}}else if(i.t!=='f'){i.vy+=G*dt;const w0=i.w;i.x+=6;i.w=14;const r=mv(i,dt);i.x-=6;i.w=w0;if(r.x)i.vx=-i.vx;if(i.t==='s'&&r.g)i.vy=-520;if(i.y>H+80)i.gone=1}
  if(i.free&&!P.dead&&hit(P,i)){i.gone=1;sc+=1000;S.pow();burst(i.x+13,i.y+13,12,'#fff',200,3);if(i.t==='m'){if(!P.pw)P.pw=1}else if(i.t==='f')P.pw=2;else P.star=9}});

 else if(st==='sel'){tx('ELIGE UN MUNDO',100,42);LV.forEach((v,i)=>{const x=50+i*300,y=150,ok=i<SV.un,g=c.createLinearGradient(0,y,0,y+290);g.addColorStop(0,v.sky[0]);g.addColorStop(1,v.sky[1]);
  c.fillStyle=i===sel?'#ffd23f':'#fff3';rr(x-5,y-5,270,300,18);c.fill();c.fillStyle=g;rr(x,y,260,290,14);c.fill();v.mt.forEach((m,k)=>{c.fillStyle=m;c.fillRect(x,y+150+k*40,260,70)});
  c.save();rr(x,y,260,290,14);c.clip();c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x,y+200,260,90);c.restore();c.textAlign='center';c.fillStyle='#fff';c.font='bold 22px system-ui,sans-serif';c.fillText('MUNDO '+(i+1),x+130,y+240);c.font='15px system-ui,sans-serif';c.fillText(v.nm,x+130,y+264);
  c.font='26px system-ui,sans-serif';c.fillText(ok?'★'.repeat(SV.st[i]||0)+'☆'.repeat(3-(SV.st[i]||0)):'🔒',x+130,y+60);c.textAlign='left';if(!ok){c.fillStyle='rgba(0,0,0,.5)';rr(x,y,260,290,14);c.fill();tx('🔒',y+170,50)}});
  tx('← → elegir · Enter o clic para jugar · Esc: volver · Récord: '+SV.hi,500,16,'#cfe8ff')}
 else if(st==='pause'){c.fillStyle='rgba(8,12,24,.6)';c.fillRect(0,0,W,H);tx('PAUSA',220,52);menu()}
 else{c.fillStyle='rgba(8,12,24,.68)';c.fillRect(0,0,W,H);
  if(st==='win'){tx('¡NIVEL COMPLETADO!',200,48,'#ffd23f');tx('★'.repeat(stars)+'☆'.repeat(3-stars),270,56);tx('Puntos: '+sc,330,24);tx('Enter: siguiente mundo · Esc: menú',400,18,'#cfe8ff')}
  else if(st==='over'){tx('FIN DEL JUEGO',220,56,'#ff6a5a');tx('Puntos: '+sc,290,26);tx('Enter: reintentar · Esc: menú',360,18,'#cfe8ff')}
  else{tx('¡JUEGO COMPLETADO!',200,52,'#ffd23f');tx('Derrotaste a Magmaron',260,24);tx('Puntos: '+sc+' · Récord: '+SV.hi,320,24);tx('★'.repeat(stars)+'☆'.repeat(3-stars),390,50);tx('Enter: menú de mundos',450,18,'#cfe8ff')}}}
function draw(){
 if(['title','sel','set'].includes(st)){cam=t*80;L=LV[0];bg();c.fillStyle='rgba(8,12,24,.55)';c.fillRect(0,0,W,H);scr()}
 else{world();if(st==='play'||st==='pause')hud();if(st!=='play')scr()}
 c.font='bold 13px system-ui,sans-serif';c.textAlign='right';c.fillStyle='rgba(0,0,0,.55)';c.fillText('Desarrollado por Brayan Moreta',W-11,H-9);c.fillStyle='#fff';c.fillText('Desarrollado por Brayan Moreta',W-12,H-10);c.textAlign='left';
 if(fade>0){c.fillStyle='rgba(0,0,0,'+fade+')';c.fillRect(0,0,W,H)}}
/* ===== ENTRADA ===== */
function act(i){
 if(st==='title'){if(i===0)go('sel');else go('set')}
 else if(st==='set'){if(i===0)SV.vol=(SV.vol+1)%11,MG&&(MG.gain.value=SV.vol/20),save();else if(i===1){SV={un:1,st:[0,0,0],hi:0,vol:SV.vol};save()}else go('title')}
 else if(st==='pause'){if(i===0){st='play';music(B&&B.act?3:L.mu)}else if(i===1)startLevel(li);else go('sel')}}
function onKey(k){const n=items(),dir=k==='ArrowDown'||k==='KeyS'?1:k==='ArrowUp'||k==='KeyW'?-1:0,ok=k==='Enter'||k==='Space';
 if(st==='play'){if(k==='Space'||k==='ArrowUp'||k==='KeyW')P.buf=.12;else if(k==='Escape'||k==='KeyP'){st='pause';msel=0;music(-1)}return}
 if(n){if(dir)msel=(msel+dir+n.length)%n.length;
  if(st==='set'&&msel===0&&(k==='ArrowLeft'||k==='ArrowRight'||k==='KeyA'||k==='KeyD')){SV.vol=mx(0,mn(10,SV.vol+(k==='ArrowRight'||k==='KeyD'?1:-1)));MG&&(MG.gain.value=SV.vol/20);save()}
  if(ok)act(msel);if(k==='Escape')st==='pause'?act(0):go('title');return}
 if(st==='sel'){if(k==='ArrowRight'||k==='KeyD')sel=mn(LV.length-1,sel+1);else if(k==='ArrowLeft'||k==='KeyA')sel=mx(0,sel-1);else if(ok&&sel<SV.un){lives=3;sc=0;coins=0;startLevel(sel)}else if(k==='Escape')go('title');return}
 if(k==='Escape'){go('sel');return}
 if(ok){if(st==='win')startLevel(li+1);else if(st==='over'){lives=3;sc=0;coins=0;startLevel(li)}else go('sel')}}
const mpos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const hitItem=(x,y)=>{const n=items();if(!n)return-1;const i=Math.floor((y-300)/64);return i>=0&&i<n.length&&(y-300)%64<48&&abs(x-W/2)<190?i:-1};
addEventListener('keydown',e=>{K[e.code]=1;ai();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat)onKey(e.code)});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0;if(st==='play')onKey('Escape')});
cv.addEventListener('pointermove',e=>{const[x,y]=mpos(e),i=hitItem(x,y);if(i>=0)msel=i});
cv.addEventListener('pointerdown',e=>{ai();const[x,y]=mpos(e),i=hitItem(x,y);
 if(items()){if(i>=0){msel=i;act(i)}}else if(st==='sel'){const k=Math.floor((x-50)/300);if(k>=0&&k<3&&y>145&&y<445){sel=k;onKey('Enter')}}else if(st!=='play')onKey('Enter')});
build(0);spawn();
let last=0;function loop(ts){const dt=mn(.033,(ts-last)/1000||0);last=ts;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
